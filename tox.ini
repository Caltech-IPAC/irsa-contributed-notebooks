[tox]
envlist =
    buildhtml
requires =
    pip >= 19.3.1

[testenv]

# We do not execute these notebooks, therefore all the config files are on the simplest side
description = Build site

passenv = BASE_URL

deps =
    # We use these files to specify all the dependencies, and below we override
    # versions for specific testing schenarios
    -rsite_requirements.txt

allowlist_externals = bash, sed

commands =
    pip freeze

    buildhtml: bash -c "jupyter-book build --html"

skip_install = true
